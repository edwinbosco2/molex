<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./stylesheets/style.css">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
    </head>
    <body>
        <header class="header">
            <div class="logoCon">
                <button class="menuBtn">
                    <img src="./images/menu_btn.png" alt="The Menu Button" class="menuBtnImg">
                </button>
                <button class="logoBtn">
                    <img src="./images/molex_logo.png" alt="Company Logo" class="logoBtnImg">
                </button>
            </div>
            <div class="searchCon">
                <button class="searchBtn">
                    <img src="./images/search_btn_black.png" alt="Search button" class="searchBtnImg">
                </button>
                <button class="loginBtn">
                    <img src="./images/login_pic.png" alt="Sign in" class="loginBtnImg">
                </button>
            </div>
        </header>
        <div class="searchCon2">
            <div class="searchBarCon">
                <input type="text" placeholder="Search" class="searchBar">
            </div>
            <div class="searchBtnCon">
                <button class="searchBtn">
                    <img src="./images/search_btn_white.png" alt="" class="searchBtnImg">
                </button>
            </div>
        </div>
        <div class="adImgCon">
            <img src="./images/molex_poster_ad.png" alt="Poster Ad" class="adImg">
        </div>
    </body>
</html>
