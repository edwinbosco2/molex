<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../stylesheets/style.css">
    </head>
    <body>
        <div class="signUpFormCon">
            <form action="" class="signUpForm">
                <p class="signUp">Sign Up</p>
                <p class="signUpMetaTxt">Create an account or Sign In</p>
                <div class="emailAddressCon">
                    <label for="" class="emailAddress">Email Address</label>
                    <input type="text" class="emailAddressInput">
                </div>
                <div class="usernameCon">
                    <label for="" class="username">Username</label>
                    <input type="text" class="usernameInput">
                </div>
                <div class="passwordCon">
                    <label for="" class="password">Password</label>
                    <input type="password" class="passwordInput">
                </div>
                <div class="repeatPasswordCon">
                    <label for="" class="repeatPassword">Repeat Password</label>
                    <input type="password" class="repeatPasswordInput">
                </div>
                <div class="termsCheckboxCon">
                    <input type="checkbox" class="termsCheckbox">
                    <span class="termsCheckboxText">I agree to the Terms of Service and Privacy Policy</span>
                </div>
                <div class="submitBtnCon">
                    <input type="submit" class="submitBtn" value="Sign Up">
                </div>
            </form>
        </div>
        <div class="signInFormCon">
            <form action="" class="signInForm">
                <p class="signIn">Sign In</p>
                <p class="signInMetaTxt">Sign in or create an account here</p>
                <div class="usernameCon">
                    <label for="" class="username">Username or email</label>
                    <input type="text" class="usernameInput">
                </div>
                <div class="passwordCon">
                    <label for="" class="password">Password</label>
                    <input type="password" class="passwordInput">
                </div>
                <div class="submitBtnCon">
                    <input type="submit" class="submitBtn" value="Sign In">
                </div>
            </form>
        </div>
    </body>
</html>
